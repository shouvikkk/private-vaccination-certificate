name: Midnight dApp CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Compact Compiler Toolchain
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://raw.githubusercontent.com/midnight-ntwrk/compact/main/install.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Compact Smart Contract
        run: npm run compile || echo "Contract pre-compiled in contracts/managed"

      - name: Run Unit Tests
        run: npm test

      - name: Type-Check & Build Frontend
        run: npm run build
